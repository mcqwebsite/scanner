<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aadhaar & IMEI 4-Button Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f6f9; padding: 15px; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
    h2 { color: #2c3e50; font-size: 18px; margin-bottom: 15px; }
    
    .status-box { background: #eef2f7; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: #34495e; min-height: 40px; display: flex; align-items: center; justify-content: center; }
    
    /* Grid Buttons */
    .btn-scan { background: #2980b9; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
    .btn-scan:active { background: #1c5980; }
    .btn-scan.done { background: #27ae60; }
    
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin: 15px auto; background: #000; display: none; }
    
    .btn-submit { background: #8e44ad; color: white; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-submit:active { background: #6c3483; }
    
    .btn-reset { background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 13px; }
    
    .badge { background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

<div class="card">
  <h2>📷 Aadhaar & IMEI Scanner</h2>
  
  <div class="status-box" id="status">ਜਿਸ ਚੀਜ਼ ਨੂੰ ਸਕੈਨ ਕਰਨਾ ਹੈ, ਉਸ ਬਟਨ 'ਤੇ ਟੈਪ ਕਰੋ</div>

  <!-- Scanner Area -->
  <div id="reader"></div>

  <!-- 4 Independent Buttons -->
  <button class="btn-scan" id="btn-1" onclick="startScanningFor(1)">
    <span>1. 👤 ਗਵਾਹ (Witness) ਆਧਾਰ</span>
    <span class="badge" id="badge-1">Pending</span>
  </button>

  <button class="btn-scan" id="btn-2" onclick="startScanningFor(2)">
    <span>2. 👤 ਕਸਟਮਰ (Customer) ਆਧਾਰ</span>
    <span class="badge" id="badge-2">Pending</span>
  </button>

  <button class="btn-scan" id="btn-3" onclick="startScanningFor(3)">
    <span>3. 📱 IMEI 1 ਬਾਰਕੋਡ</span>
    <span class="badge" id="badge-3">Pending</span>
  </button>

  <button class="btn-scan" id="btn-4" onclick="startScanningFor(4)">
    <span>4. 📱 IMEI 2 ਬਾਰਕੋਡ</span>
    <span class="badge" id="badge-4">Pending</span>
  </button>

  <!-- Final Submit Button -->
  <button class="btn-submit" onclick="redirectToAppSheet()">🚀 AppSheet ਵਿੱਚ ਡਾਟਾ ਭੇਜੋ</button>
  
  <button class="btn-reset" onclick="location.reload()">ਮੁੜ ਸ਼ੁਰੂ ਕਰੋ (Reset)</button>
</div>

<script>
  const APPSHEET_APP_ID = "MakeaLoan-954896914";
  const APPSHEET_FORM_NAME = "New Loan"; 

  let html5QrCode = null;
  let activeTarget = null;

  let collectedData = {
    witness: { name: "", father: "", address: "", aadhaar: "" },
    customer: { name: "", father: "", address: "", aadhaar: "" },
    mobile: { imei1: "", imei2: "" }
  };

  async function startScanningFor(target) {
    activeTarget = target;
    const statusDiv = document.getElementById("status");
    const readerDiv = document.getElementById("reader");

    // Stop existing scanner if running
    if (html5QrCode && html5QrCode.isScanning) {
      await html5QrCode.stop();
    }

    readerDiv.style.display = "block";
    statusDiv.innerText = `⏳ ਕੈਮਰਾ ਖੁੱਲ੍ਹ ਰਿਹਾ ਹੈ (Target: ${getTargetName(target)})...`;

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader", {
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });
    }

    const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
      .then(() => {
        statusDiv.innerText = `${getTargetName(target)} ਦਾ QR / Barcode ਸਾਹਮਣੇ ਕਰੋ...`;
      })
      .catch(err => {
        html5QrCode.start({ facingMode: "user" }, config, onScanSuccess);
      });
  }

  function onScanSuccess(decodedText) {
    if (!activeTarget) return;

    let target = activeTarget;
    activeTarget = null; // Prevent double trigger

    // Stop Camera after scan
    html5QrCode.stop().then(() => {
      document.getElementById("reader").style.display = "none";
    }).catch(() => {
      document.getElementById("reader").style.display = "none";
    });

    if (target === 1) {
      collectedData.witness = parseAadhaar(decodedText);
      markButtonDone(1, "✓ Witness Scanned");
    } 
    else if (target === 2) {
      collectedData.customer = parseAadhaar(decodedText);
      markButtonDone(2, "✓ Customer Scanned");
    } 
    else if (target === 3) {
      collectedData.mobile.imei1 = decodedText.replace(/\D/g, '').slice(0, 15);
      markButtonDone(3, "✓ IMEI 1 Scanned");
    } 
    else if (target === 4) {
      collectedData.mobile.imei2 = decodedText.replace(/\D/g, '').slice(0, 15);
      markButtonDone(4, "✓ IMEI 2 Scanned");
    }

    document.getElementById("status").innerText = "✓ ਸਕੈਨ ਸਫ਼ਲ ਰਿਹਾ! ਅਗਲਾ ਬਟਨ ਚੁਣੋ ਜਾਂ AppSheet ਵਿੱਚ ਭੇਜੋ।";
  }

  function markButtonDone(target, text) {
    const btn = document.getElementById(`btn-${target}`);
    const badge = document.getElementById(`badge-${target}`);
    btn.classList.add("done");
    badge.innerText = text;
  }

  function getTargetName(target) {
    if (target === 1) return "ਗਵਾਹ ਆਧਾਰ";
    if (target === 2) return "ਕਸਟਮਰ ਆਧਾਰ";
    if (target === 3) return "IMEI 1";
    if (target === 4) return "IMEI 2";
    return "";
  }

  function parseAadhaar(qrData) {
    let data = { name: "", father: "", address: "", aadhaar: "" };
    try {
      if (qrData.includes("<PrintLetterBarcodeData")) {
        let parser = new DOMParser();
        let xmlDoc = parser.parseFromString(qrData, "text/xml");
        let node = xmlDoc.getElementsByTagName("PrintLetterBarcodeData")[0];

        if (node) {
          data.name = node.getAttribute("name") || "";
          data.father = node.getAttribute("co") || node.getAttribute("gname") || "";
          data.aadhaar = node.getAttribute("uid") || "";
          
          let house = node.getAttribute("house") || "";
          let loc = node.getAttribute("loc") || "";
          let vtc = node.getAttribute("vtc") || "";
          let dist = node.getAttribute("dist") || "";
          let state = node.getAttribute("state") || "";
          let pc = node.getAttribute("pc") || "";

          data.address = [house, loc, vtc, dist, state, pc].filter(Boolean).join(", ");
        }
      } else {
        data.aadhaar = qrData.replace(/\D/g, '').slice(-12);
      }
    } catch (e) {
      data.aadhaar = qrData.replace(/\D/g, '').slice(-12);
    }
    return data;
  }

  function redirectToAppSheet() {
    let defaults = {
      "Name": collectedData.witness.name,
      "Father Name": collectedData.witness.father,
      "Address": collectedData.witness.address,
      "Adhaar": collectedData.witness.aadhaar,
      "Customer Name": collectedData.customer.name,
      "Father Name_Customer": collectedData.customer.father,
      "Address_Customer": collectedData.customer.address,
      "Aadhaar_Customer": collectedData.customer.aadhaar,
      "IMEINumberone": collectedData.mobile.imei1,
      "IMEINumbertwo": collectedData.mobile.imei2
    };

    let encodedDefaults = encodeURIComponent(JSON.stringify(defaults));
    let encodedFormName = encodeURIComponent(APPSHEET_FORM_NAME);
    let deepLink = `https://www.appsheet.com/start/${APPSHEET_APP_ID}#control=${encodedFormName}&Defaults=${encodedDefaults}`;
    
    window.location.href = deepLink;
  }
</script>

</body>
</html>
