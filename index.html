<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aadhaar & IMEI Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f6f9; padding: 15px; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
    h2 { color: #2c3e50; font-size: 18px; margin-bottom: 10px; }
    .status-box { background: #eef2f7; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: #34495e; min-height: 45px; display: flex; align-items: center; justify-content: center; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin: 10px auto; background: #000; }
    .btn-reset { background: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    
    /* Pop-up Modal Box Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal-box { background: white; padding: 25px; border-radius: 12px; max-width: 320px; width: 85%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center; animation: popIn 0.3s ease; }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-title { color: #27ae60; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .modal-msg { color: #2c3e50; font-size: 15px; margin-bottom: 20px; line-height: 1.4; }
    .btn-ok { background: #27ae60; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
    .btn-ok:active { background: #2196f3; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="step-title">1. Scan Witness (ਗਵਾਹ) Aadhaar</h2>
  <div class="status-box" id="status">ਕੈਮਰੇ ਦੇ ਸਾਹਮਣੇ QR ਕੋਡ ਲਿਆਓ...</div>
  
  <div id="reader"></div>
  
  <button class="btn-reset" onclick="location.reload()">ਮੁੜ ਸ਼ੁਰੂ ਕਰੋ (Reset)</button>
</div>

<!-- Custom Pop-up Modal -->
<div class="modal-overlay" id="popup-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">✓ ਸਕੈਨ ਹੋ ਗਿਆ!</div>
    <div class="modal-msg" id="modal-msg">ਅਗਲਾ ਸਕੈਨ ਕਰਨ ਲਈ OK ਦਬਾਓ।</div>
    <button class="btn-ok" onclick="handleOkClick()">OK (ਅਗਲਾ ਸਕੈਨ ਕਰੋ)</button>
  </div>
</div>

<script>
  const APPSHEET_APP_ID = "MakeaLoan-954896914";
  const APPSHEET_FORM_NAME = "New Loan"; 

  let currentStep = 1; 
  let html5QrCode;
  let isProcessing = false;
  let onOkCallback = null;

  let collectedData = {
    witness: { name: "", father: "", address: "", aadhaar: "" },
    customer: { name: "", father: "", address: "", aadhaar: "" },
    mobile: { imei1: "", imei2: "" }
  };

  function startScanner() {
    html5QrCode = new Html5Qrcode("reader", {
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });

    const config = { 
      fps: 10, 
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0
    };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
      .catch(err => {
        html5QrCode.start({ facingMode: "user" }, config, onScanSuccess);
      });
  }

  function showPopup(title, message, nextAction) {
    document.getElementById("modal-title").innerText = title;
    document.getElementById("modal-msg").innerText = message;
    document.getElementById("popup-modal").style.display = "flex";
    onOkCallback = nextAction;
  }

  function handleOkClick() {
    document.getElementById("popup-modal").style.display = "none";
    if (onOkCallback) {
      onOkCallback();
      onOkCallback = null;
    }
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    try {
      if (currentStep === 1) {
        // Step 1: Witness Aadhaar
        collectedData.witness = parseAadhaar(decodedText);
        try { html5QrCode.pause(true); } catch(e){}

        showPopup(
          "✓ ਗਵਾਹ (Witness) ਆਧਾਰ ਸਕੈਨ ਹੋ ਗਿਆ!",
          "ਕਸਟਮਰ ਦਾ ਆਧਾਰ ਕਾਰਡ ਸਕੈਨ ਕਰਨ ਲਈ OK ਦਬਾਓ।",
          function() {
            currentStep = 2;
            document.getElementById("step-title").innerText = "2. Scan Customer (ਕਸਟਮਰ) Aadhaar";
            document.getElementById("status").innerText = "ਹੁਣ ਕਸਟਮਰ ਦਾ ਆਧਾਰ ਕਾਰਡ ਸਾਹਮਣੇ ਕਰੋ...";
            isProcessing = false;
            try { html5QrCode.resume(); } catch(e){}
          }
        );
      } 
      else if (currentStep === 2) {
        // Step 2: Customer Aadhaar
        collectedData.customer = parseAadhaar(decodedText);
        try { html5QrCode.pause(true); } catch(e){}

        showPopup(
          "✓ ਕਸਟਮਰ (Customer) ਆਧਾਰ ਸਕੈਨ ਹੋ ਗਿਆ!",
          "ਮੋਬਾਈਲ ਦਾ ਪਹਿਲਾ IMEI (IMEI 1) ਸਕੈਨ ਕਰਨ ਲਈ OK ਦਬਾਓ।",
          function() {
            currentStep = 3;
            document.getElementById("step-title").innerText = "3. Scan Mobile IMEI 1";
            document.getElementById("status").innerText = "ਮੋਬਾਈਲ ਦਾ ਪਹਿਲਾ IMEI ਬਾਰਕੋਡ ਸਾਹਮਣੇ ਕਰੋ...";
            isProcessing = false;
            try { html5QrCode.resume(); } catch(e){}
          }
        );
      } 
      else if (currentStep === 3) {
        // Step 3: IMEI 1
        collectedData.mobile.imei1 = decodedText.replace(/\D/g, '').slice(0, 15);
        try { html5QrCode.pause(true); } catch(e){}

        showPopup(
          "✓ IMEI 1 ਸਕੈਨ ਹੋ ਗਿਆ!",
          "ਦੂਜਾ IMEI (IMEI 2) ਸਕੈਨ ਕਰਨ ਲਈ OK ਦਬਾਓ।",
          function() {
            currentStep = 4;
            document.getElementById("step-title").innerText = "4. Scan Mobile IMEI 2";
            document.getElementById("status").innerText = "ਦੂਜਾ IMEI ਬਾਰਕੋਡ ਸਾਹਮਣੇ ਕਰੋ...";
            isProcessing = false;
            try { html5QrCode.resume(); } catch(e){}
          }
        );
      }
      else if (currentStep === 4) {
        // Step 4: IMEI 2
        collectedData.mobile.imei2 = decodedText.replace(/\D/g, '').slice(0, 15);
        try { html5QrCode.pause(true); } catch(e){}

        document.getElementById("status").innerText = "⏳ ਸਾਰਾ ਡਾਟਾ ਸਕੈਨ ਹੋ ਗਿਆ! AppSheet ਖੋਲ੍ਹਿਆ ਜਾ ਰਿਹਾ ਹੈ...";
        redirectToAppSheet();
      }
    } catch (err) {
      document.getElementById("status").innerText = "⚠️ ਸਕੈਨਿੰਗ ਵਿੱਚ ਸਮੱਸਿਆ ਆਈ, ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।";
      isProcessing = false;
    }
  }

  function parseAadhaar(qrData) {
    let data = { name: "", father: "", address: "", aadhaar: "" };
    try {
      if (qrData.includes("<PrintLetterBarcodeData")) {
        let parser = new DOMParser();
        let xmlDoc = parser.parseFromString(qrData, "text/xml");
        let node = xmlDoc.getElementsByTagName("PrintLetterBarcodeData")[0];

        if (node) {
          data.name = node.getAttribute("name") || "";
          data.father = node.getAttribute("co") || node.getAttribute("gname") || "";
          data.aadhaar = node.getAttribute("uid") || "";
          
          let house = node.getAttribute("house") || "";
          let loc = node.getAttribute("loc") || "";
          let vtc = node.getAttribute("vtc") || "";
          let dist = node.getAttribute("dist") || "";
          let state = node.getAttribute("state") || "";
          let pc = node.getAttribute("pc") || "";

          data.address = [house, loc, vtc, dist, state, pc].filter(Boolean).join(", ");
        }
      } else {
        data.aadhaar = qrData.replace(/\D/g, '').slice(-12);
      }
    } catch (e) {
      data.aadhaar = qrData.replace(/\D/g, '').slice(-12);
    }
    return data;
  }

  function redirectToAppSheet() {
    let defaults = {
      "Name": collectedData.witness.name,
      "Father Name": collectedData.witness.father,
      "Address": collectedData.witness.address,
      "Adhaar": collectedData.witness.aadhaar,
      "Customer Name": collectedData.customer.name,
      "Father Name_Customer": collectedData.customer.father,
      "Address_Customer": collectedData.customer.address,
      "Aadhaar_Customer": collectedData.customer.aadhaar,
      "IMEINumberone": collectedData.mobile.imei1,
      "IMEINumbertwo": collectedData.mobile.imei2
    };

    let encodedDefaults = encodeURIComponent(JSON.stringify(defaults));
    let encodedFormName = encodeURIComponent(APPSHEET_FORM_NAME);
    let deepLink = `https://www.appsheet.com/start/${APPSHEET_APP_ID}#control=${encodedFormName}&Defaults=${encodedDefaults}`;
    
    window.location.href = deepLink;
  }

  window.onload = startScanner;
</script>

</body>
</html>
